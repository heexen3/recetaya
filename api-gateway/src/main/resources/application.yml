server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Microservicio Auth (Login, Registro y Gestión de Usuarios)
        - id: ms-auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuth

        # 2. Microservicio Recetas
        - id: ms-recetas
          uri: ${RECETAS_URL:http://localhost:8082}
          predicates:
            - Path=/api/recetas/**
          filters:
            - name: JwtAuth

        # 3. Microservicio Inventario (Medicamentos, Sucursales y Stock)
        - id: ms-inventario-medicamentos
          uri: ${INVENTARIO_URL:http://localhost:8083}
          predicates:
            - Path=/api/medicamentos/**
          filters:
            - name: JwtAuth

        - id: ms-inventario-sucursales
          uri: ${INVENTARIO_URL:http://localhost:8083}
          predicates:
            - Path=/api/sucursales/**
          filters:
            - name: JwtAuth

        - id: ms-inventario-stock
          uri: ${INVENTARIO_URL:http://localhost:8083}
          predicates:
            - Path=/api/stock/**
          filters:
            - name: JwtAuth

        # 4. Microservicio Dispensación
        - id: ms-dispensacion
          uri: ${DISPENSACION_URL:http://localhost:8084}
          predicates:
            - Path=/api/dispensaciones/**
          filters:
            - name: JwtAuth

app:
  jwt:
    secret: ${JWT_SECRET:clave-secreta-muy-larga-para-firmar-tokens-jwt-recetaya-2026}
